<!DOCTYPE html>  <html lang="id">  <head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>My To-Do List</title>  <style>  body {    font-family: Arial, sans-serif;    background: #fff0f5;    padding: 25px 12px;    text-align: center;  }    .container {    background: white;    max-width: 420px;    margin: auto;    padding: 22px;    border-radius: 20px;    box-shadow: 0 4px 15px #e8c5d2;  }    h1 {    color: #d66b91;  }    input {    padding: 12px;    width: 58%;    border: 1px solid pink;    border-radius: 8px;  }    button {    padding: 11px;    border: none;    border-radius: 8px;    background: #e995b4;    color: white;  }    ul {    padding: 0;    list-style: none;  }    li {    display: flex;    align-items: center;    gap: 8px;    background: #fff0f5;    padding: 10px;    margin: 10px 0;    border-radius: 10px;    text-align: left;  }    .task {    flex: 1;    overflow-wrap: anywhere;  }    .done {    text-decoration: line-through;    color: gray;  }    .delete {    background: #d66b91;  }  </style>  </head>  <body>  <div class="container">  <h1>♡ My To-Do List ♡</h1>  <p>Organize your day!</p>  <input id="task" placeholder="Tulis kegiatan...">  <button onclick="addTask()">Tambah</button>  <p id="count">Jumlah tugas: 0</p>  <ul id="list"></ul>  <p>♡ You can do it! ♡</p>  </div>  <script>  function addTask() {    let input = document.getElementById("task");    let value = input.value.trim();      if (value === "") {      alert("Tulis kegiatan dulu!");      return;    }      let li = document.createElement("li");      let check = document.createElement("input");    check.type = "checkbox";      let task = document.createElement("span");    task.className = "task";    task.textContent = value;      check.onchange = function() {      task.classList.toggle("done", check.checked);    };      let del = document.createElement("button");    del.textContent = "Hapus";    del.className = "delete";      del.onclick = function() {      li.remove();      updateCount();    };      li.appendChild(check);    li.appendChild(task);    li.appendChild(del);      document.getElementById("list").appendChild(li);      input.value = "";    updateCount();  }    function updateCount() {    let total = document.querySelectorAll("#list li").length;    document.getElementById("count").textContent =      "Jumlah tugas: " + total;  }  </script>  </body>  </html>
